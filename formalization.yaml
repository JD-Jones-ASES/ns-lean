      comparator_config: "comparator.json"

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)", "GPT-6 (OpenAI)", "Grok"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        Claude (Anthropic), GPT-6 (OpenAI) and Grok were used throughout; the
        construction and its proofs arose in consultation among these systems, and the repository
        was written by Claude. Lean 4.33.0 and Mathlib v4.33.0 (commit db584cd6) are pinned by the
        committed manifest and lake update is never run. There is no native_decide; the largest
        kernel computations are the code property, decided over all 100 ordered pairs of words, and the comparison
        3^128 <= 810^21.
  spend_usd: "not tracked"
  notes: "See DISCLOSURE.md."

fidelity:
  divergences: >-
    The compared statements are the negation of the source's Conjecture 13 at q = 3, k = 2, not a
    formalization of it, and the source's Theorem 1 is not re-derived here. Degree bounds are
    stated as natDegree f < n, a comparison of natural numbers, so that no statement type depends
    on an instance that can diverge; since the zero polynomial has natural degree 0, that form
    cannot express P_{3,0} = {0}, and the recursion therefore works internally with degree in
    WithBot, converting at n >= 1, where the two agree. The conjectured exponent is written
    3 * n / 4 with natural division, which is exact on the hypothesis 4 divides n.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is recorded; AI agents
    developed and cross-reviewed the proof, the statements were checked against the source text,
    and VERIFICATION.md states what is checked and what is not.

alignment:
  namespace: "NS"
  statements:
    - source: "Counterexample to Naslund, Conjecture 13 at q = 3, k = 2, n = 8"
      lean: "NS.D3_8_ge_810"
      module: "Solution"
      status: "proved"
      note: "A square-difference-free subset of P_{3,8} with 810 elements, the first lift of {0}."
    - source: "Counterexample to Naslund, Conjecture 13 at q = 3, k = 2, n = 8"
      lean: "NS.conjecture13_fails_3_2_8"
      module: "Solution"
      status: "proved"
      note: "Not every square-difference-free subset of P_{3,8} has at most 3^6 = 729 elements."
    - source: "Not in any source: the first family"
      lean: "NS.D3_8e_ge"
      module: "Solution"
      status: "proved"
      note: "For every e >= 1, a square-difference-free subset of P_{3,8e} with 810^e elements."
    - source: "Not in any source: the second family"
      lean: "NS.D3_8e4_ge"
      module: "Solution"
      status: "proved"
      note: "For every e, a square-difference-free subset of P_{3,8e+4} with 27 * 810^e elements."
    - source: "Counterexample to Naslund, Conjecture 13 at q = 3, k = 2, at every admissible n >= 8"
      lean: "NS.conjecture13_fails_3_2_all"
      module: "Solution"
      status: "proved"
      note: >-
        For 4 dividing n and n >= 8, not every square-difference-free subset of P_{3,n} has at
        most 3^(3n/4) elements; the two families exceed the bound by (10/9)^e.
    - source: "Not in any source: the growth rate"
      lean: "NS.liminf_ge"
      module: "Solution"
      status: "proved"
      note: >-
        16/21 <= liminf log D_3(n) / (n log 3), from the first family and the comparison
        3^128 <= 810^21.

