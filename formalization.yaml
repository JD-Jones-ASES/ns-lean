version: "v0.4"

project:
  name: "ns-lean: Naslund's Conjecture 13 is false at q = 3, k = 2, for every n congruent to 0 mod 4 with n >= 8"
  description: >-
    A Lean 4 proof that square-difference-free subsets of the polynomials of degree below n over
    F_3 can be larger than 3^(3n/4). Call A square-difference-free when no two of its elements
    differ by a nonzero square, and let D_3(n) be the largest size of such a set inside P_{3,n}.
    A ten-word code S in F_3^4, in which no two words differ by a vector with every coordinate in
    {0, 1}, drives a lift that carries a square-difference-free subset of P_{3,m} to one of
    P_{3,m+8} with 810 times as many elements. Iterating it from the bases {0} and
    B_4 = {a T^3 + b T + c (1 - T^2)} gives square-difference-free sets of size 810^e in degree
    below 8e and 27 * 810^e in degree below 8e + 4, so the conjectured bound 3^(3n/4) fails at
    every n divisible by 4 with n >= 8, and
    16/21 <= liminf log D_3(n) / (n log 3).
  authors: ["JD Jones"]
  responsible_maintainers: ["JD Jones"]
  license: "MIT"

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11T55", "11B30", "05B40"]

sources:
  - title: "Paley graphs and Sárközy's theorem in function fields"
    authors: ["Eric Naslund"]
    id: "doi:10.1093/qmath/haac035"
    type: "article"
    location: "https://doi.org/10.1093/qmath/haac035"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The Quarterly Journal of Mathematics 74 (2023), no. 2, 627-637; arXiv:2203.01293v3. Adapted,
      not formalized as stated: the development takes the source's setting (square-difference-free
      subsets of P_{q,n}) at q = 3 and proves the negation of its Conjecture 13 at k = 2, for every
      n congruent to 0 mod 4 with n >= 8, by a construction that is this development's. Theorem 1's
      construction is not formalized here, and nothing is claimed at any other q or k.
  - title: "The Sperner capacity of linear and nonlinear codes for the cyclic triangle"
    authors: ["A. R. Calderbank", "P. Frankl", "R. L. Graham", "W.-C. W. Li", "L. A. Shepp"]
    id: "doi:10.1023/A:1022424630332"
    type: "article"
    location: "https://doi.org/10.1023/A:1022424630332"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Journal of Algebraic Combinatorics 2 (1993), no. 1, 31-48. The setting of the ten-word code:
      a linear code has at most 3^(n/2) words, so 9 at n = 4, and the LP bound there is 11. No
      statement of this paper is formalized.
  - title: "On the Sperner capacity of the cyclic triangle"
    authors: ["Aart Blokhuis"]
    id: "doi:10.1023/A:1022455407000"
    type: "article"
    location: "https://doi.org/10.1023/A:1022455407000"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Journal of Algebraic Combinatorics 2 (1993), no. 2, 123-124. The upper bound 2^n in the same
      setting. Not formalized here.
  - title: "Difference sets without squares"
    authors: ["Imre Z. Ruzsa"]
    id: "doi:10.1007/BF02454169"
    type: "article"
    location: "https://doi.org/10.1007/BF02454169"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Periodica Mathematica Hungarica 15 (1984), no. 3, 205-209. The digit construction that
      Naslund's Theorem 1 adapts. Not formalized here.

