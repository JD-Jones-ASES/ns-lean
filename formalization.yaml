status:
  scope: >-
    Six compared declarations over four compared definitions. Four of them exhibit
    square-difference-free sets of polynomials over F_3 (810 elements in degree below 8, 810^e in
    degree below 8e, 27 * 810^e in degree below 8e + 4) and two of them draw the consequences:
    the conjectured bound 3^(3n/4) fails at every n divisible by 4 with n >= 8, and
    16/21 <= liminf log D_3(n) / (n log 3). No upper bound on D_3(n) is proved, no value of
    D_3(n) is determined, the ten-word code is not claimed to be optimal, and nothing is claimed
    at any q other than 3. The intentional placeholders of Challenge.lean are excluded from proof
    counts; Solution.lean does not import Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "NS.D3_8_ge_810"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NS.conjecture13_fails_3_2_8"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NS.D3_8e_ge"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NS.D3_8e4_ge"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NS.conjecture13_fails_3_2_all"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
    - declaration: "NS.liminf_ge"
      file: "Solution.lean"
      sorry_count: 0
